<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contar tiempo</title>
</head>
<body>
    <p>Set an alarm in seconds
        <input type="number" id="timeInput">
               
    <button onclick="startTime()">Alarm</button>
    <button onclick="reset()"> Reset</button>
    <h1 id="alarmState" style="color: red;">Turned Off</h1>
</p>



   <script>
        function startTime() {
            let time = document.getElementById("timeInput").value;
            setTimeout(timeOut, 1000 * time);
        }
        function timeOut() {
         //   alert("Time is up!");
         document.getElementById("alarmState").innerHTML = "Turned On";
         document.getElementById("alarmState").style.color = "green";
        }

        function reset() {
            document.getElementById("alarmState").innerHTML = "Turned Off";
            document.getElementById("alarmState").style.color = "red";
            document.getElementById("timeInput").value = "";
        }


   </script> 
</body>
</html>
